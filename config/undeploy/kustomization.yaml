apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Both broker variants install the same resource identities as config/default.
# Remove the operator resources, but never the durable registration CRD.
resources:
- ../default

patches:
- target:
    kind: CustomResourceDefinition
    name: managementclusterregistrations.hyperfleet.redhat.com
  patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: managementclusterregistrations.hyperfleet.redhat.com
