# Prometheus Monitor Service (Metrics).
# This is the plain-HTTP GitOps profile. It is intentionally separate from the
# runtime bootstrapper; set --metrics-service-monitor-enabled=false when applying
# this manifest so two field managers never own the same ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: hyperfleet-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: hyperfleet-system
spec:
  endpoints:
    - path: /metrics
      port: metrics # matches the metrics Service port name
      # Matches the HyperFleet metrics standard default (--metrics-secure=false).
      # Use config/secure-metrics for the complete secure profile instead.
      scheme: http
      interval: 30s
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: hyperfleet-operator
