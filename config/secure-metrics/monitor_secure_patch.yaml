- op: replace
  path: /spec/endpoints/0/scheme
  value: https
- op: add
  path: /spec/endpoints/0/tlsConfig
  value:
    # Kustomize replacements in this overlay derive the service and namespace.
    serverName: controller-manager-metrics-service.system.svc
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
- op: add
  path: /spec/endpoints/0/authorization
  value:
    type: Bearer
    credentials:
      name: hyperfleet-metrics-scrape-credentials
      key: token
