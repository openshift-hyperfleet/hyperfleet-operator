apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRD removal deliberately preserves the durable Hub registration records.
resources:
- ../crd

patches:
- target:
    kind: CustomResourceDefinition
    name: managementclusterregistrations.hyperfleet.redhat.com
  patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: managementclusterregistrations.hyperfleet.redhat.com
