apiVersion: v1
kind: Service
metadata:
  name: hyperfleet-postgres
  labels:
    app.kubernetes.io/name: hyperfleet-postgres
spec:
  selector:
    app.kubernetes.io/name: hyperfleet-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperfleet-postgres
  labels:
    app.kubernetes.io/name: hyperfleet-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperfleet-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperfleet-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: docker.io/library/postgres:14.2
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hyperfleet
            - name: POSTGRES_USER
              value: hyperfleet
            - name: POSTGRES_PASSWORD
              value: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
