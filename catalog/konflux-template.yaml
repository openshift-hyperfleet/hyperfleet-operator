# Catalog template, rendered before the image build (never inside catalog.Dockerfile):
#   - Konflux: the run-opm-command task in .tekton/hyperfleet-operator-catalog-push.yaml
#   - Local:   make catalog-render (swaps the olm.bundle image for BUNDLE_IMG)
# The olm.bundle image below is updated by Konflux build-nudges, do not edit it by hand.
schema: olm.template.basic
entries:
  - schema: olm.package
    name: hyperfleet-operator
    defaultChannel: stable
    description: "HyperFleet Operator"
  - schema: olm.channel
    name: stable
    package: hyperfleet-operator
    entries:
      - name: hyperfleet-operator.v0.0.1
        skipRange: "<0.0.1"
  - schema: olm.bundle
    image: quay.io/redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-operator-bundle@sha256:df9391d84dd7bc8102b6adb3d86bb7b20332ef9c8000a7a4a2c4f6a19ce6c09e
